[package]
name = "privchat-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "privchat_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
privchat-common = { path = "../../privchat-common" }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = "1.0.3"
iroh-tickets = "1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
anyhow = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "3"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri-plugin-barcode-scanner = "2.4.5"
pbkdf2 = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
