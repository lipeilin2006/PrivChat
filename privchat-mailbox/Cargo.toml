[package]
name = "privchat-mailbox"
version = "0.1.0"
edition = "2021"

[dependencies]
privchat-common = { path = "../privchat-common" }
iroh = "1.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
